<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>每日新聞 · 語言學習</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("nl_theme"))||"auto"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=6">
</head>
<body data-cat="local">
<header><div class="wrap">
  <div class="top">
    <h1><small>Daily News · Language</small>每日新聞學語言</h1>
    <div style="text-align:right"><div id="date"></div>
      <div class="hbtns"><button id="themeBtn" class="ghb"></button><button id="setBtn" class="ghb">⚙️ 語言</button><button id="ghBtn" class="ghb">📊 用量</button></div></div>
  </div>
  <div id="pnav"></div>
  <div class="mode" id="mode">
    <button data-mode="tw">🇹🇼 台灣新聞<small>中文 → 翻成外語</small></button>
    <button data-mode="native">🌐 當地原文新聞<small>外語原文 → 翻成中文</small></button>
  </div>
  <nav class="cats" id="cats"></nav>
  <nav class="langs" id="langs"></nav>
</div></header>

<main class="wrap">
  <div class="bar">
    <label><input type="checkbox" id="showZh" checked> <span id="zhLabel">顯示中文原文</span></label>
    <select id="region" class="hidden"></select>
    <select id="count"><option value="10">10 則</option><option value="15">15 則</option><option value="20">20 則</option></select>
    <span id="status"></span>
    <button class="rf" id="refresh">↻ 重新抓取</button>
  </div>
  <div id="list">
    <div class="msg"><b>如果你一直看到這段文字</b><br>代表目前的開啟方式不能執行網頁程式。<span class="tip">請用 Chrome / Safari 開啟這個網址。</span></div>
  </div>
</main>

<button id="vocabBtn">📒 單字本 <span id="vcount"></span></button>
<div id="shade" class="shade hidden"></div>
<div id="pop" class="sheet hidden"></div>
<div id="vocab" class="sheet hidden"></div>
<div id="gh" class="sheet hidden"></div>
<div id="setFull" class="full hidden"></div>
<div id="full" class="full hidden"></div>

<script src="common.js?v=6"></script>
<script>
/* ====== 狀態 ====== */
const NEWS_CATS = ['local','world','fin','pol','tech','health','life'];
let cache = store.get('nl_cache4', null);
if(!cache || cache.date !== today) cache = {date:today, feeds:{}, tr:{}};
const saveCache = () => { try{ localStorage.setItem('nl_cache4', JSON.stringify(cache)); }catch(e){ cache.tr = {}; store.set('nl_cache4', cache); } };
try{ localStorage.removeItem('nl_cache3'); localStorage.removeItem('nl_cache2'); }catch(e){}
let state = { mode: store.get('nl_mode','tw'), cat: store.get('nl_cat2','local'), lang: store.get('nl_lang','en'),
              showZh: store.get('nl_zh', true), count: store.get('nl_count', 20), regions: store.get('nl_regions', {}) };
const oldRegion = store.get('nl_region', null); if(oldRegion && !state.regions.en) state.regions.en = oldRegion;
function fixState(){
  const L = allLangs();
  if(!L[state.lang] || L[state.lang].hidden) state.lang = 'en';
  if(!NEWS_CATS.includes(state.cat)) state.cat = 'local';
}
fixState();
const R = (lang = state.lang) => regionOf(lang, state.regions[lang]);
let renderToken = 0;

async function trans(text, sl, tl){
  const key = sl + '>' + tl + '|' + text;
  if(cache.tr[key]) return cache.tr[key];
  const r = await translate(text, sl, tl);
  cache.tr[key] = r; saveCache();
  return r;
}

/* ====== 捲動位置保護：開關視窗、播放發音都不會跳回第一則 ====== */
let lockY = 0, locks = 0;
function lockScroll(){ if(locks++ === 0){ lockY = window.scrollY; const b = document.body.style; b.position = 'fixed'; b.top = -lockY + 'px'; b.left = '0'; b.right = '0'; } }
function unlockScroll(){ if(locks > 0 && --locks === 0){ const b = document.body.style; b.position = ''; b.top = ''; b.left = ''; b.right = ''; window.scrollTo(0, lockY); } }
function openSheet(el){ if(el.classList.contains('hidden')){ lockScroll(); } $('#shade').classList.remove('hidden'); el.classList.remove('hidden'); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => { if(!s.classList.contains('hidden')){ s.classList.add('hidden'); unlockScroll(); } }); $('#shade').classList.add('hidden'); }
document.addEventListener('mousedown', e => { if(e.target.closest('.sheet button')) e.preventDefault(); });

/* ====== 上方選單 ====== */
const catName = k => k === 'local' ? (state.mode === 'tw' ? '🇹🇼 台灣' : R().label) : CATS[k].name;
function renderNav(){
  const L = allLangs(), cur = L[state.lang];
  document.body.dataset.cat = state.cat === 'local' ? 'tw' : state.cat;
  document.body.style.setProperty('--l', cur.color);
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
  $('#cats').innerHTML = NEWS_CATS.map(k => `<button data-cat="${k}" class="${k === state.cat ? 'on' : ''}">${catName(k)}</button>`).join('');
  $('#langs').innerHTML = Object.entries(L).filter(([k, l]) => !l.hidden).map(([k, l]) =>
    `<button data-lang="${k}" class="${k === state.lang ? 'on' : ''}" style="${k === state.lang ? 'background:' + l.color : ''}">${esc(l.name)}</button>`).join('');
  $('#showZh').checked = state.showZh;
  $('#zhLabel').textContent = state.mode === 'tw' ? '顯示中文原文' : '顯示中文翻譯';
  $('#count').value = String(state.count);
  const regs = Object.keys(cur.regions), rs = $('#region');
  rs.classList.toggle('hidden', regs.length < 2);
  rs.innerHTML = regs.map(k => { const r = regionOf(state.lang, k); return `<option value="${k}">${state.mode === 'tw' ? r.flag + ' ' + r.accent + '口音' : r.label}</option>`; }).join('');
  rs.value = R().key;
}

/* ====== 新聞列表 ====== */
async function render(force = false){
  const token = ++renderToken, {mode, cat, lang, count} = state, list = $('#list');
  const native = mode === 'native';
  const srcLang = native ? lang : 'zh', srcRegion = native ? R().key : 'tw';
  const fkey = `${srcLang}-${srcRegion}|${cat}`;
  $('#status').textContent = '';
  if(force){ delete cache.feeds[fkey]; saveCache(); }
  let items = cache.feeds[fkey];
  if(!items){
    list.innerHTML = Array.from({length:4}, () => `<div class="card"><div class="skel" style="width:30%"></div><div style="height:10px"></div><div class="skel"></div><div style="height:8px"></div><div class="skel" style="width:90%"></div></div>`).join('');
    $('#status').textContent = '抓取中…';
    try{ items = await loadFeed(srcLang, srcRegion, cat); cache.feeds[fkey] = items; saveCache(); }
    catch(e){
      if(token !== renderToken) return;
      $('#status').textContent = '';
      list.innerHTML = `<div class="msg"><b>暫時抓不到新聞</b><br>所有免費新聞管道都沒有回應。
        <span class="tip">1. 確認有連上網路，再按「↻ 重新抓取」。<br>2. 換成手機網路試試。<br>3. 自訂的地區如果 Google 新聞沒有這個版本，也會抓不到。</span></div>`;
      return;
    }
  }
  if(token !== renderToken) return;
  items = items.slice(0, count);
  const L = allLangs()[lang], reg = R();
  const legend = (native ? `📰 ${reg.label}當地媒體的原文標題，下方附中文翻譯${lang === 'en' ? '，並解釋台灣人不熟的縮寫與名詞' : ''}。<br>` : `📰 台灣新聞，翻譯成 ${esc(L.name)}（${reg.accent}發音）。<br>`) +
    (lang === 'en' ? `<mark>標底線的字</mark> 是比較難的單字。點任何一個字，都能看中文解釋、音標、聽發音。`
     : L.words ? `點任何一個字，都能看中文解釋、音標、聽發音。` : `斜體字是羅馬拼音，按 🔊 可以聽整句發音。`);
  const tag = `<span class="tag">${esc(L.short)}</span>`;
  list.innerHTML = `<div class="legend">${legend}</div>` + items.map((it, i) => `
    <article class="card" data-i="${i}" data-orig="${esc(it.title)}" data-link="${esc(it.link)}" data-src="${esc(it.source)}" ${native ? `data-text="${esc(it.title)}"` : ''}>
      <div class="meta"><span><span class="num">${String(i + 1).padStart(2, '0')}</span>${esc(it.source)}</span><span>${fmtTime(it.date)}</span></div>
      ${native
        ? `<div class="tr" style="border-top:none;padding-top:4px">${tag}<span class="tx">${wordify(it.title, lang)}</span></div>
           <div class="rm"></div>
           <div class="zh zhb ${state.showZh ? '' : 'hidden'}"><span class="skel"></span></div>
           ${lang === 'en' ? glossBox(findGloss(it.title)) : ''}`
        : `<div class="zh ${state.showZh ? '' : 'hidden'}">${esc(it.title)}</div>
           <div class="tr">${tag}<span class="tx"><span class="skel"></span></span></div>
           <div class="rm"></div>`}
      <div class="ents hidden"></div>
      <div class="acts">
        <button data-say="1">🔊 ${esc(reg.accent)}</button><button data-say="0.6">🐢 慢速</button>
        <button data-ent="1">🔍 名詞解釋</button><button data-art="1">📖 全文</button>
        <a href="${esc(it.link)}" target="_blank" rel="noopener">🔗 原始網站</a>
      </div>
    </article>`).join('');
  $('#status').textContent = '翻譯中…';
  await pool(items.map((it, i) => async () => {
    const card = () => list.querySelector(`.card[data-i="${i}"]`);
    if(native){
      let r; try{ r = await trans(it.title, lang, 'zh-TW'); }catch(e){ r = {t:'（翻譯暫時失敗）', rmS:''}; }
      if(token !== renderToken || !card()) return;
      card().querySelector('.zhb').textContent = r.t;
      card().querySelector('.rm').textContent = L.words ? '' : (r.rmS || '');
    }else{
      let r; try{ r = await trans(it.title, 'zh-TW', lang); }catch(e){ r = {t:'（翻譯暫時失敗，按「↻ 重新抓取」再試）', rmT:''}; }
      if(token !== renderToken || !card()) return;
      card().dataset.text = r.t;
      card().querySelector('.tx').innerHTML = wordify(r.t, lang);
      card().querySelector('.rm').textContent = r.rmT || '';
    }
  }), 4);
  if(token === renderToken) $('#status').textContent = `${items.length} 則`;
}
const glossBox = gs => gs.length ? `<div class="gloss">📎 ${gs.map(g => `<b>${esc(g.key)}</b> ${esc(g.zh)}${g.note ? '：' + esc(g.note) : ''}`).join('<br>📎 ')}</div>` : '';
function wordify(text, lang){
  if(!allLangs()[lang]?.words) return esc(text);
  return text.split(/([\p{L}][\p{L}'’\-]*)/u).map((p, i) =>
    i % 2 ? `<span class="w${isHard(p, lang) ? ' hard' : ''}" data-w="${esc(p)}">${esc(p)}</span>` : esc(p)).join('');
}

/* ====== 名詞解釋 ====== */
async function toggleEnts(card){
  const box = card.querySelector('.ents');
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  if(box.dataset.done) return;
  box.innerHTML = `<div class="ent-h">🔍 名詞解釋</div><div class="skel"></div>`;
  const native = state.mode === 'native';
  let plan = {wl:'en', items:[], note:''};
  try{
    plan = await planEntities({orig: card.dataset.orig, srcLang: native ? state.lang : 'zh', region: native ? R().key : 'tw',
                               intl: !native || state.cat === 'world', enText: !native && state.lang === 'en' ? card.dataset.text : ''});
  }catch(e){}
  const res = await explainAll(plan);
  box.innerHTML = entsHTML(plan, res);
  box.dataset.done = 1;
}

/* ====== 單字視窗（含音標與口音） ====== */
function accentRows(lang){
  const L = allLangs()[lang], cur = R(lang);
  return Object.keys(L.regions).map(k => regionOf(lang, k)).sort((a, b) => (b.key === cur.key) - (a.key === cur.key));
}
async function openWord(word, ctx){
  const lang = state.lang, pop = $('#pop'), cur = R(lang);
  openSheet(pop);
  pop.innerHTML = `<div class="hd"><span class="big">${esc(word)}</span><button class="x" data-close>×</button></div><div class="skel" style="margin-top:10px"></div>`;
  const [r, ph, ipa] = await Promise.all([
    lookup(word, lang),
    lang === 'en' ? enPhonetics(word) : Promise.resolve(null),
    lang !== 'en' && allLangs()[lang].words ? wiktIPA(word, lang) : Promise.resolve('')
  ]);
  const meaning = r.main + (r.dict.length ? '；' + r.dict.map(p => p.pos + ' ' + p.terms.slice(0, 3).join('、')).join('；') : '');
  const saved = store.get('nl_vocab', []).some(v => v.w.toLowerCase() === word.toLowerCase() && v.lang === lang);
  let rows = '';
  let usedG = false;
  const hint = tts => { if(voiceFor(tts).exact) return ''; usedG = true; return '<span class="hint">＊</span>'; };
  if(lang === 'en'){
    rows += `<div class="row"><span class="lb">🇺🇸 美式</span><span class="ip">KK ${esc(ph.kk || '—')}</span><button data-pw="us">🔊 美式發音</button>${ph.us.audio ? '' : hint('en-US')}</div>`;
    rows += `<div class="row"><span class="lb">🇬🇧 英式</span><span class="ip">IPA ${esc(ph.uk.ipa || '—')}</span><button data-pw="uk">🔊 英式發音</button>${ph.uk.audio ? '' : hint('en-GB')}</div>`;
    accentRows('en').filter(a => !['us', 'uk'].includes(a.key)).forEach(a =>
      rows += `<div class="row"><span class="lb">${a.flag} ${esc(a.place)}</span><button data-pw="${a.key}">🔊 ${esc(a.accent)}</button>${hint(a.tts)}</div>`);
    rows += `<div class="hint">KK 音標由美式國際音標換算。${ph.us.audio || ph.uk.audio ? '美式／英式有真人錄音。' : ''}</div>`;
  }else{
    const sym = ipa ? `IPA /${esc(ipa.replace(/^\/|\/$/g, ''))}/` : (r.rm ? `拼音 ${esc(r.rm)}` : '');
    accentRows(lang).forEach((a, i) =>
      rows += `<div class="row"><span class="lb">${a.flag} ${esc(a.accent)}</span>${i === 0 && sym ? `<span class="ip">${sym}</span>` : ''}<button data-pw="${a.key}">🔊 發音</button><button data-pw="${a.key}" data-slow="1">🐢</button>${hint(a.tts)}</div>`);
    rows += `<div class="hint">${ipa ? '國際音標（IPA）來自維基詞典。' : sym ? '羅馬拼音來自 Google 翻譯。' : '這個字查不到音標。'}</div>`;
  }
  if(usedG) rows += '<div class="hint">＊ 手機沒有這個口音的語音，改用 Google 語音播放。</div>';
  pop.innerHTML = `
    <div class="hd"><span class="big">${esc(word)}</span><button class="x" data-close>×</button></div>
    <div class="mean">${esc(r.main)}</div>
    ${r.dict.map(p => `<div class="pos"><b>${esc(p.pos)}</b>${esc(p.terms.join('、'))}</div>`).join('')}
    <div class="phon">${rows}</div>
    <div class="acts" style="margin-top:14px"><button class="sbtn" id="pSave">${saved ? '✓ 已在單字本' : '☆ 加入單字本'}</button></div>
    <div class="ex">例句　${esc(ctx)}</div>`;
  pop.querySelectorAll('[data-pw]').forEach(b => b.onclick = e => {
    e.preventDefault();
    const k = b.dataset.pw, rate = b.dataset.slow ? 0.55 : 0.9;
    if(lang === 'en' && (k === 'us' || k === 'uk') && ph[k].audio && !b.dataset.slow) return playUrl(ph[k].audio).catch(() => sayText(word, regionOf('en', k).tts, rate));
    sayText(word, regionOf(lang, k).tts, rate);
  });
  $('#pSave').onclick = e => {
    e.preventDefault();
    const v = store.get('nl_vocab', []);
    if(!v.some(x => x.w.toLowerCase() === word.toLowerCase() && x.lang === lang)){
      v.unshift({w:word, lang, m:meaning, ctx, d:today, ph: lang === 'en' ? (ph.kk || '') : (ipa || r.rm || '')}); store.set('nl_vocab', v);
    }
    $('#pSave').textContent = '✓ 已在單字本'; updateCount();
  };
}

/* ====== 全文閱讀 ====== */
let artPlayer = null, art = null;
function artPlayerGet(){
  return artPlayer ||= new Player((i, playing) => {
    document.querySelectorAll('#full .para').forEach(p => p.classList.toggle('now', +p.dataset.k === artPlayer.items[i]?.k));
    const now = document.querySelector('#full .para.now');
    if(now && playing) now.scrollIntoView({block:'center', behavior:'smooth'});
    const pp = $('#artPP'); if(pp) pp.textContent = playing ? '❚❚' : '▶';
    const t = $('#artNow'); if(t) t.textContent = i < 0 ? '播放完畢' : `第 ${i + 1} 段 / 共 ${artPlayer.items.length} 段`;
  });
}
async function openArticle(card){
  const full = $('#full'), native = state.mode === 'native';
  const srcLang = native ? state.lang : 'zh', tgtLang = native ? 'zh-TW' : state.lang;
  const srcTts = native ? R().tts : 'zh-TW', tgtTts = native ? 'zh-TW' : R().tts;
  lockScroll(); full.classList.remove('hidden'); full.scrollTop = 0;
  art = {card, srcLang, tgtLang, srcTts, tgtTts, paras:[], trs:[]};
  const head = `<div class="fbar"><div class="wrap">
      <button class="back" data-artclose>← 返回</button>
      <a href="${esc(card.dataset.link)}" target="_blank" rel="noopener">🔗 原始網站</a>
      <label style="font-size:13px;color:var(--soft);display:flex;gap:4px;align-items:center"><input type="checkbox" id="artTr" checked>翻譯</label>
    </div></div>`;
  full.innerHTML = head + `<div class="wrap"><h2>${esc(card.dataset.orig)}</h2><div class="note">${esc(card.dataset.src)} · 正在從原始網站擷取全文…</div><div class="skel"></div><div style="height:8px"></div><div class="skel" style="width:80%"></div></div>`;
  let a;
  try{ a = await fetchArticle(card.dataset.link); }
  catch(e){
    if(full.classList.contains('hidden')) return;
    full.innerHTML = head + `<div class="wrap"><h2>${esc(card.dataset.orig)}</h2>
      <div class="msg"><b>這篇擷取不到全文</b><br>可能是付費牆、網站擋住轉接，或是 Google 新聞的轉址解不開。
      <span class="tip">請按上方「🔗 原始網站」直接到網站閱讀。</span></div></div>`;
    return;
  }
  if(full.classList.contains('hidden')) return;
  art.paras = a.paras;
  full.innerHTML = head + `<div class="wrap" style="padding-bottom:120px">
      <h2>${esc(a.title || card.dataset.orig)}</h2>
      <div class="note">${esc(a.site || card.dataset.src)} · 共 ${a.paras.length} 段 · 點任何一段可從那裡開始朗讀</div>
      ${a.paras.map((p, k) => `<div class="para" data-k="${k}"><div class="o">${esc(p)}</div><div class="t"><span class="skel"></span></div></div>`).join('')}
      <div class="note">全文從原始網站擷取，只暫時顯示在這裡，關掉就不保留。</div>
    </div>
    <div class="dock"><div class="wrap">
      <button class="pp" id="artPP">▶</button>
      <div class="now-t" id="artNow">按 ▶ 開始朗讀（可背景播放）</div>
      <select id="artWhich"><option value="src">讀原文</option><option value="tgt">讀翻譯</option><option value="both">原文＋翻譯</option></select>
      <select id="artRate"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option></select>
    </div></div>`;
  $('#artTr').onchange = e => full.querySelectorAll('.para .t').forEach(t => t.classList.toggle('hidden', !e.target.checked));
  $('#artRate').onchange = e => artPlayerGet().setRate(+e.target.value);
  $('#artPP').onclick = () => artPlay();
  $('#artWhich').onchange = () => { if(artPlayer?.playing) artPlay(artPlayer.items[artPlayer.i]?.k || 0, true); };
  full.querySelectorAll('.para').forEach(p => p.onclick = () => artPlay(+p.dataset.k, true));
  await pool(a.paras.map((p, k) => async () => {
    let t = ''; try{ t = (await translate(p, srcLang === 'zh' ? 'zh-TW' : srcLang, tgtLang)).t; }catch(e){ t = '（翻譯失敗）'; }
    art.trs[k] = t;
    const el = full.querySelector(`.para[data-k="${k}"] .t`); if(el) el.textContent = t;
  }), 3);
}
function artPlay(fromK, restart){
  const P = artPlayerGet();
  if(P.items.length && !restart && P.items[0]?.art === art){ P.toggle(); return; }
  const which = $('#artWhich').value, items = [];
  art.paras.forEach((p, k) => {
    if(which !== 'tgt') items.push({k, text:p, tts:art.srcTts, art, label:p.slice(0, 50)});
    if(which !== 'src' && art.trs[k]) items.push({k, text:art.trs[k], tts:art.tgtTts, art, label:art.trs[k].slice(0, 50)});
  });
  P.load(items, '新聞全文朗讀');
  P.setRate(+$('#artRate').value);
  P.play(Math.max(0, items.findIndex(x => x.k >= (fromK || 0))));
}
function closeArticle(){ artPlayer?.stop(); $('#full').classList.add('hidden'); $('#full').innerHTML = ''; art = null; unlockScroll(); }

/* ====== 單字本（分語言） ====== */
function updateCount(){ const n = store.get('nl_vocab', []).length; $('#vcount').textContent = n ? `· ${n}` : ''; }
let vocabBook = null;
function openVocab(book){
  const all = store.get('nl_vocab', []), el = $('#vocab'), L = allLangs();
  openSheet(el);
  const counts = {}; all.forEach(x => counts[x.lang] = (counts[x.lang] || 0) + 1);
  vocabBook = book || vocabBook || state.lang;
  if(!L[vocabBook]) vocabBook = 'en';
  const items = all.map((x, i) => ({...x, i})).filter(x => x.lang === vocabBook);
  el.style.borderTopColor = L[vocabBook].color;
  el.innerHTML = `<div class="hd"><span class="big">📒 單字本</span><button class="x" data-close>×</button></div>
    <div class="vtabs">${Object.entries(L).filter(([k, l]) => !l.hidden).map(([k, l]) =>
      `<button data-vbook="${k}" class="${k === vocabBook ? 'on' : ''}" style="${k === vocabBook ? 'background:' + l.color : ''}">${esc(l.name)} ${counts[k] || 0}</button>`).join('')}</div>
    ${items.length ? '' : `<div class="msg">${esc(L[vocabBook].name)} 單字本還是空的。<br>點新聞裡的字，再按「☆ 加入單字本」。</div>`}
    ${items.map(x => `<div class="vi"><div><b>${esc(x.w)}</b> ${x.ph ? `<small>${esc(x.ph)}</small>` : ''} <small>${x.d}</small><br>${esc(x.m)}<br><small>${esc(x.ctx)}</small></div>
      <div style="display:flex;flex-direction:column;gap:5px"><button class="sbtn" data-vsay="${x.i}">🔊</button><button class="sbtn" data-vdel="${x.i}">刪除</button></div></div>`).join('')}
    ${items.length ? `<div class="acts" style="margin-top:12px"><button id="vCopy">複製 ${esc(L[vocabBook].name)} 單字（${items.length}）</button></div>` : ''}`;
  const c = $('#vCopy');
  if(c) c.onclick = async () => { try{ await navigator.clipboard.writeText(items.map(x => `${x.w}\t${x.ph || ''}\t${x.m}`).join('\n')); c.textContent = '已複製 ✓'; }catch(e){ c.textContent = '無法複製'; } };
}

/* ====== 語言／地區設定：只要輸入名稱 ====== */
function openSettings(){
  const el = $('#setFull'), L = allLangs();
  if(el.classList.contains('hidden')){ lockScroll(); el.classList.remove('hidden'); }
  el.innerHTML = `<div class="fbar"><div class="wrap"><button class="back" data-setclose>← 返回</button><b style="font-size:15px">⚙️ 語言與地區</b></div></div>
  <div class="wrap" style="padding-bottom:60px">
    <div class="sec-t">＋ 新增語言</div>
    <div class="inrow"><input id="nLang" placeholder="例如：越南語、葡萄牙文、Swahili" enterkeyhint="done"><button class="btn solid" id="nAdd">加入</button></div>
    <div class="note">只要輸入語言名稱（中文、英文、當地文字都可以），會自動找出語言代碼，並先加入這個語言的主要國家。</div>
    <div class="sec-t">＋ 幫某個語言多加一個國家</div>
    <div class="inrow"><select id="fLang" style="border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font-size:16px;max-width:42%">${Object.entries(L).filter(([k, l]) => !l.hidden).map(([k, l]) => `<option value="${k}">${esc(l.name)}</option>`).join('')}</select>
      <input id="fCountry" placeholder="例如：愛爾蘭、墨西哥" enterkeyhint="done"><button class="btn solid" id="fAdd">加入</button></div>
    <div id="sMsg" class="note" style="color:var(--c)"></div>
    <div class="sec-t">目前的語言和國家</div>
    <div class="note">切換國家就會抓那個國家的當地新聞，發音也換成當地口音。你自己加的可以按 × 刪除。</div>
    ${Object.entries(L).filter(([k, l]) => !l.hidden).map(([k, l]) => `
      <div style="margin:10px 0 2px;font-weight:500;color:${l.color}">${esc(l.name)}${l.custom ? ` <button class="ghb" data-dellang="${k}">刪除這個語言</button>` : ''}</div>
      <div>${Object.keys(l.regions).map(rk => { const r = regionOf(k, rk);
        return `<span class="chip">${r.label}${l.regions[rk].custom || l.custom ? `<button data-delreg="${k}|${rk}">×</button>` : '<span style="width:6px"></span>'}</span>`; }).join('')}</div>`).join('')}
  </div>`;
  const msg = (s, err) => { const m = $('#sMsg'); m.textContent = s; m.style.color = err ? 'var(--health)' : 'var(--c)'; };
  const addLang = async () => {
    const q = $('#nLang').value; if(!q.trim()) return;
    msg('🔎 查詢中…');
    const f = await findLanguage(q);
    if(!f){ msg(`找不到「${q}」這個語言，換個寫法試試（例如英文名稱）。`, true); return; }
    if(allLangs()[f.code]){ msg(`${f.zh}（${f.code}）已經有了。`, true); return; }
    const c = customCfg(); c.langs[f.code] = {name:f.name, short:f.code.toUpperCase(), words:f.words, regions:{[f.cc.toLowerCase()]:{cc:f.cc, place:f.place}}};
    saveCustom(c); renderNav(); openSettings();
    msg(`✅ 已加入 ${f.zh}（${f.name}），國家：${f.place}。回到新聞頁就能選它。`);
  };
  const addReg = async () => {
    const lang = $('#fLang').value, q = $('#fCountry').value; if(!q.trim()) return;
    msg('🔎 查詢中…');
    const f = await findCountry(q);
    if(!f){ msg(`找不到「${q}」這個國家。`, true); return; }
    const rk = f.cc.toLowerCase();
    if(allLangs()[lang].regions[rk]){ msg(`${f.place} 已經有了。`, true); return; }
    const c = customCfg();
    if(c.langs[lang]) c.langs[lang].regions[rk] = {cc:f.cc, place:f.place};
    else { c.regions[lang] = c.regions[lang] || {}; c.regions[lang][rk] = {cc:f.cc, place:f.place}; }
    saveCustom(c); renderNav(); openSettings();
    msg(`✅ ${allLangs()[lang].name} 已加入 ${f.place}。`);
  };
  $('#nAdd').onclick = addLang; $('#nLang').onkeydown = e => { if(e.key === 'Enter'){ e.target.blur(); addLang(); } };
  $('#fAdd').onclick = addReg; $('#fCountry').onkeydown = e => { if(e.key === 'Enter'){ e.target.blur(); addReg(); } };
}
function closeSettings(){ const el = $('#setFull'); if(el.classList.contains('hidden')) return; el.classList.add('hidden'); el.innerHTML = ''; unlockScroll(); render(); }

/* ====== GitHub 用量 ====== */
const REPO = 'venus52mom-lab/News-learn';
async function openGitHub(){
  const el = $('#gh'); openSheet(el);
  let pageKB = 0;
  try{ pageKB = Math.round(performance.getEntriesByType('navigation').concat(performance.getEntriesByType('resource').filter(r => r.name.includes(location.host)))
         .reduce((s, r) => s + (r.decodedBodySize || 0), 0) / 1024); }catch(e){}
  if(!pageKB) pageKB = 150;
  let localKB = 0;
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); localKB += (k.length + (localStorage.getItem(k) || '').length) * 2; } }catch(e){}
  localKB = Math.round(localKB / 1024);
  const vocabN = store.get('nl_vocab', []).length;
  el.innerHTML = `<div class="hd"><span class="big">📊 GitHub 用量</span><button class="x" data-close>×</button></div><div class="skel" style="margin-top:10px"></div>`;
  let repo = null;
  try{ repo = await timeout(fetch('https://api.github.com/repos/' + REPO).then(r => r.ok ? r.json() : null), 10000); }catch(e){}
  const sizeKB = repo?.size ?? null;
  const pct = sizeKB != null ? Math.max(0.01, sizeKB / (1024 * 1024) * 100) : null;
  const opens = Math.round(100 * 1024 * 1024 / Math.max(pageKB, 1));
  el.innerHTML = `
    <div class="hd"><span class="big">📊 GitHub 用量</span><button class="x" data-close>×</button></div>
    <div class="gh-sec"><div class="gh-t">儲存空間 <small>上限 1 GB</small></div>
      ${sizeKB != null ? `<div class="meter"><span style="width:${Math.min(100, pct)}%"></span></div><div class="gh-n">已用 <b>${sizeKB < 1024 ? sizeKB + ' KB' : (sizeKB / 1024).toFixed(1) + ' MB'}</b>（約 ${pct.toFixed(2)}%）${pct < 50 ? ' · ✅ 很安全' : pct < 90 ? ' · ⚠️ 留意' : ' · ❌ 快滿了'}</div>
        <div class="gh-n" style="color:var(--mute)">這是整個專案（包含你其他 App）的大小。</div>`
        : `<div class="gh-n">暫時讀不到（GitHub 每小時限查 60 次，稍後再試）</div>`}</div>
    <div class="gh-sec"><div class="gh-t">網路流量 <small>上限每月約 100 GB</small></div>
      <div class="gh-n">打開這個網頁約下載 <b>${pageKB} KB</b>，每月大約可以打開 <b>${opens.toLocaleString()} 次</b>。</div>
      <div class="gh-n" style="color:var(--mute)">新聞、翻譯、全文、語音都是手機直接向各網站拿，不經過 GitHub，不算流量。GitHub 不公開實際流量；訪客數可登入看 <a href="https://github.com/${REPO}/graphs/traffic" target="_blank" rel="noopener">流量統計 ↗</a>。</div></div>
    <div class="gh-sec"><div class="gh-t">資料存在哪裡？</div>
      <div class="gh-n">GitHub 上只有網頁程式檔。新聞、翻譯、全文、廣播、電子書內容都<b>不會</b>存到 GitHub。</div>
      <div class="gh-n">今天的新聞暫存和單字本只存在<b>這支手機的瀏覽器</b>（約 ${localKB} KB）。新聞暫存每天自動清空；單字本 ${vocabN} 個字，瀏覽器大約可存 1 萬個字以上。</div>
      <div class="acts" style="margin-top:8px"><button data-clear="cache">清除今天的新聞暫存</button><button data-clear="vocab">清空單字本</button></div></div>
    ${repo ? `<div class="gh-n" style="color:var(--mute);margin-top:8px">最後更新：${fmtTime(repo.pushed_at)} · <a href="${repo.html_url}" target="_blank" rel="noopener">GitHub 專案 ↗</a></div>` : ''}`;
}
let clearArm = '';
function clearLocal(what){
  const btn = document.querySelector(`[data-clear="${what}"]`);
  if(clearArm !== what){ clearArm = what; btn.textContent = '再按一次確認'; return; }
  clearArm = '';
  if(what === 'cache'){ cache = {date:today, feeds:{}, tr:{}}; saveCache(); btn.textContent = '已清除 ✓'; }
  else { store.set('nl_vocab', []); updateCount(); btn.textContent = '已清空 ✓'; }
}

/* ====== 事件 ====== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-setclose],[data-artclose],[data-art],[data-dellang],[data-delreg],[data-vbook],[data-ent],[data-clear],[data-mode],[data-cat],[data-lang],[data-close],[data-say],.w,[data-vdel],[data-vsay],#shade');
  if(!t) return;
  if(t.id === 'shade' || t.dataset.close !== undefined) closeSheets();
  else if(t.dataset.setclose !== undefined) closeSettings();
  else if(t.dataset.artclose !== undefined) closeArticle();
  else if(t.dataset.art){ openArticle(t.closest('.card')); }
  else if(t.dataset.dellang){ const c = customCfg(); delete c.langs[t.dataset.dellang]; saveCustom(c); fixState(); renderNav(); openSettings(); }
  else if(t.dataset.delreg){ const [l, rk] = t.dataset.delreg.split('|'); const c = customCfg(); delete c.regions[l]?.[rk]; if(c.langs[l]){ delete c.langs[l].regions[rk]; if(!Object.keys(c.langs[l].regions).length) delete c.langs[l]; } saveCustom(c); fixState(); renderNav(); openSettings(); }
  else if(t.dataset.vbook){ openVocab(t.dataset.vbook); }
  else if(t.dataset.ent){ toggleEnts(t.closest('.card')); }
  else if(t.dataset.clear){ clearLocal(t.dataset.clear); }
  else if(t.dataset.mode){ state.mode = t.dataset.mode; store.set('nl_mode', state.mode); renderNav(); render(); }
  else if(t.dataset.cat){ state.cat = t.dataset.cat; store.set('nl_cat2', state.cat); renderNav(); render(); window.scrollTo({top:0}); }
  else if(t.dataset.lang){ state.lang = t.dataset.lang; store.set('nl_lang', state.lang); renderNav(); render(); }
  else if(t.dataset.say){ const c = t.closest('.card'); if(c.dataset.text) sayText(c.dataset.text, R().tts, +t.dataset.say); }
  else if(t.classList.contains('w')){ openWord(t.dataset.w, t.closest('.card').dataset.text || ''); }
  else if(t.dataset.vdel !== undefined){ const v = store.get('nl_vocab', []); v.splice(+t.dataset.vdel, 1); store.set('nl_vocab', v); updateCount(); $('#vocab').classList.add('hidden'); unlockScroll(); openVocab(); }
  else if(t.dataset.vsay !== undefined){ const x = store.get('nl_vocab', [])[+t.dataset.vsay]; if(x) sayText(x.w, R(x.lang).tts, 0.8); }
});
$('#showZh').onchange = e => { state.showZh = e.target.checked; store.set('nl_zh', state.showZh); document.querySelectorAll('.card .zh').forEach(z => z.classList.toggle('hidden', !state.showZh)); };
$('#count').onchange = e => { state.count = +e.target.value; store.set('nl_count', state.count); render(); };
$('#region').onchange = e => { state.regions[state.lang] = e.target.value; store.set('nl_regions', state.regions); renderNav(); if(state.mode === 'native') render(); };
$('#refresh').onclick = () => render(true);
$('#vocabBtn').onclick = () => openVocab(state.lang);
$('#themeBtn').onclick = cycleTheme;
$('#ghBtn').onclick = openGitHub;
$('#setBtn').onclick = openSettings;

$('#pnav').innerHTML = pageNav('index.html');
applyTheme();
const wk = new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei', weekday:'long'}).format(new Date());
$('#date').innerHTML = `${today.replace(/-/g, '.')} ${wk}`;
renderNav(); updateCount(); render();
</script>
</body>
