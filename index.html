<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<title>每日新聞 · 語言學習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("nl_theme"))||"auto"}catch(e){}</script>
<style>
:root{
  --bg:#f4f1ea; --paper:#fbfaf6; --ink:#2f2d29; --soft:#5f5b53; --mute:#8f897d; --line:#e4dfd3;
  /* 分類色（低飽和） */
  --tw:#6f8f7a;  --tw-bg:#e8eee9;
  --world:#6f84a0; --world-bg:#e7ebf1;
  --fin:#a68c5f; --fin-bg:#f1ebdf;
  --tech:#7f7a9e; --tech-bg:#ebe9f1;
  --health:#ad7f84; --health-bg:#f2e8e8;
  --life:#8a9a68; --life-bg:#eceee3;
  --pol:#8f7b6e; --pol-bg:#efe9e5;
  /* 語言色（低飽和） */
  --en:#5f7a8c; --ja:#a47b7b; --fr:#8a7fa3; --ko:#6d9393; --es:#b0806a; --th:#8b9466;
  --hard:#efe2c4; --hard-line:#c4a46a;
  --c:var(--tw); --cbg:var(--tw-bg); --l:var(--en);
}

:root[data-theme=dark]{
  --bg:#1b1c1e; --paper:#232427; --ink:#e4e1d9; --soft:#b8b3a8; --mute:#878278; --line:#333438;
  --tw:#86a28f; --world:#8597b0; --fin:#b29d76; --tech:#958fb0; --health:#b8959a; --life:#9cab80; --pol:#a8958a;
  --tw-bg:#232a26; --world-bg:#22262d; --fin-bg:#2b2822; --tech-bg:#26252d; --health-bg:#2c2527; --life-bg:#262922; --pol-bg:#2a2624;
  --en:#7891a3; --ja:#b08c8c; --fr:#9a90b3; --ko:#7fa3a3; --es:#b8917e; --th:#9aa27a;
  --hard:#383226; --hard-line:#9c8455;
}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{
  --bg:#1b1c1e; --paper:#232427; --ink:#e4e1d9; --soft:#b8b3a8; --mute:#878278; --line:#333438;
  --tw:#86a28f; --world:#8597b0; --fin:#b29d76; --tech:#958fb0; --health:#b8959a; --life:#9cab80; --pol:#a8958a;
  --tw-bg:#232a26; --world-bg:#22262d; --fin-bg:#2b2822; --tech-bg:#26252d; --health-bg:#2c2527; --life-bg:#262922; --pol-bg:#2a2624;
  --en:#7891a3; --ja:#b08c8c; --fr:#9a90b3; --ko:#7fa3a3; --es:#b8917e; --th:#9aa27a;
  --hard:#383226; --hard-line:#9c8455;
}}
body[data-cat=pol]{--c:var(--pol);--cbg:var(--pol-bg)}
body[data-cat=world]{--c:var(--world);--cbg:var(--world-bg)}
body[data-cat=fin]{--c:var(--fin);--cbg:var(--fin-bg)}
body[data-cat=tech]{--c:var(--tech);--cbg:var(--tech-bg)}
body[data-cat=health]{--c:var(--health);--cbg:var(--health-bg)}
body[data-cat=life]{--c:var(--life);--cbg:var(--life-bg)}
body[data-lang=ja]{--l:var(--ja)} body[data-lang=fr]{--l:var(--fr)} body[data-lang=ko]{--l:var(--ko)}
body[data-lang=es]{--l:var(--es)} body[data-lang=th]{--l:var(--th)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding-top:14px}
h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:400;font-size:11px;color:var(--mute);letter-spacing:.18em;text-transform:uppercase}
#date{font-size:12px;color:var(--mute);text-align:right;line-height:1.4}
.mode{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-top:12px}
.mode button{flex:1;border:none;background:none;border-radius:8px;padding:6px 4px;font-size:13px;color:var(--soft);cursor:pointer;line-height:1.35}
.mode button small{display:block;font-size:10.5px;color:var(--mute)}
.mode button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cats{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:1 0 auto;border:none;background:none;padding:8px 10px 9px;font-size:15px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.cats button.on{color:var(--c);border-color:var(--c)}
.bar select{border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:8px;padding:2px 6px;font-size:12.5px}
.cats button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:2px}
.langs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.langs button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:999px;padding:4px 13px;font-size:13px;cursor:pointer;transition:.2s}
.langs button.on{color:#fff;border-color:transparent}
main{padding-top:14px;padding-bottom:100px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:12px;gap:10px;flex-wrap:wrap}
.bar label{display:flex;gap:5px;align-items:center;cursor:pointer}
.bar input{accent-color:var(--c)}
.bar .rf{border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.legend{font-size:12.5px;color:var(--soft);background:var(--cbg);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.legend mark{background:var(--hard);color:inherit;border-bottom:1.5px solid var(--hard-line);padding:0 3px;border-radius:2px}
.card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px 12px 12px 4px;padding:14px 16px 12px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute);letter-spacing:.03em}
.num{font-family:"Noto Serif TC",serif;color:var(--c);font-weight:700;margin-right:8px}
.zh{font-family:"Noto Serif TC",serif;font-weight:500;font-size:16.5px;line-height:1.6;color:var(--ink);margin:6px 0 8px}
.tr{font-size:17.5px;line-height:1.75;color:var(--ink);border-top:1px dashed var(--line);padding-top:8px;position:relative}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;color:var(--l);border:1px solid var(--l);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:3px;opacity:.85}
.rm{font-size:13px;color:var(--mute);font-style:italic;margin-top:3px;line-height:1.5}
.w{cursor:pointer;border-radius:2px;transition:background .15s}
.w:hover{background:var(--cbg)}
.w.hard{background:var(--hard);border-bottom:1.5px solid var(--hard-line);padding:0 2px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts button,.acts a{font-size:12.5px;border:1px solid var(--line);background:none;color:var(--soft);border-radius:8px;padding:3px 11px;text-decoration:none;cursor:pointer}
.acts button:hover,.acts a:hover{border-color:var(--c);color:var(--c)}
.skel{display:inline-block;height:14px;width:70%;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.msg{text-align:center;color:var(--soft);padding:36px 14px;line-height:1.9;font-size:14.5px}
.msg b{color:var(--ink)}
.msg .tip{display:block;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:13.5px;color:var(--soft)}
.hidden{display:none!important}
.shade{position:fixed;inset:0;background:rgba(30,28,25,.25);z-index:15}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:3px solid var(--l);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:16px 18px 26px;max-height:72vh;overflow:auto;max-width:720px;margin:0 auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .big{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:700}
.sheet .x{border:none;background:none;font-size:24px;color:var(--mute);cursor:pointer;line-height:1}
.mean{font-size:18px;margin-top:4px}
.pos{margin-top:6px;font-size:14px;color:var(--soft)}
.pos b{display:inline-block;min-width:3.2em;font-weight:500;color:var(--l)}
.sbtn{border:1px solid var(--l);color:var(--l);background:none;border-radius:8px;padding:4px 12px;font-size:13.5px;cursor:pointer}
.ex{font-size:13px;color:var(--mute);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
#vocabBtn{position:fixed;right:16px;bottom:18px;z-index:10;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
#vocab{border-top-color:var(--ink)}
.vi{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px}
.vi .lg{font-size:10.5px;border-radius:4px;padding:0 5px;color:#fff;margin-left:6px;vertical-align:2px}
.vi small{color:var(--mute)}
.vtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;scrollbar-width:none}
.vtabs button{flex:none;border:1px solid var(--line);background:none;color:var(--soft);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.vtabs button.on{color:#fff;border-color:transparent}
.ghb{border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:999px;padding:1px 9px;font-size:11px;cursor:pointer;margin-top:3px}
.ents{margin-top:10px;background:var(--cbg);border-radius:10px;padding:10px 12px}
.ent-h{font-size:12.5px;color:var(--c);font-weight:500;margin-bottom:4px}
.ent-h small{color:var(--mute);font-weight:400;margin-left:6px}
.ent{padding:8px 0;border-top:1px dashed var(--line)}
.ent:first-of-type{border-top:none}
.ent-t{font-size:15px}.ent-t b{color:var(--ink)}
.ent-full{font-size:12.5px;color:var(--soft);margin-top:1px}
.ent-d{font-size:13.5px;color:var(--soft);line-height:1.65;margin-top:4px}
.ent-l{display:flex;gap:14px;margin-top:4px;font-size:12.5px}
.ent-l a,.gh-n a{color:var(--c)}
.ent-n{font-size:12.5px;color:var(--mute);margin-top:4px}
#gh{border-top-color:var(--world)}
.gh-sec{padding:12px 0;border-bottom:1px solid var(--line)}
.gh-t{font-weight:500;font-size:15px}.gh-t small{color:var(--mute);font-weight:400;margin-left:6px;font-size:12px}
.gh-n{font-size:13.5px;color:var(--soft);margin-top:5px;line-height:1.65}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;background:var(--tw);min-width:3px;border-radius:99px}
</style>
</head>
<body data-cat="tw" data-lang="en">
<header><div class="wrap">
  <div class="top">
    <h1><small>Daily News · Language</small>每日新聞學語言</h1>
    <div style="text-align:right"><div id="date"></div><button id="themeBtn" class="ghb"></button> <button id="ghBtn" class="ghb">📊 用量</button></div>
  </div>
  <div class="mode" id="mode">
    <button data-mode="tw">🇹🇼 台灣新聞<small>中文 → 翻成外語</small></button>

  <nav class="cats" id="cats"></nav>

</div></header>

<main class="wrap">

    <span id="status"></span>
    <button class="rf" id="refresh">↻ 重新抓取</button>
  </div>
  <div id="list">
    <div class="msg"><b>如果你一直看到這段文字</b><br>代表目前的開啟方式不能執行網頁程式（例如手機的「檔案預覽」、LINE 或 Email 內建預覽）。
      <span class="tip">✅ 請用 <b>Chrome / Safari 瀏覽器</b>開啟，或把檔案上傳到 tiiny.host、Netlify Drop 之類的免費空間，取得網址後用手機瀏覽器打開。</span></div>
  </div>
</main>

<button id="vocabBtn">📒 單字本 <span id="vcount"></span></button>

/* ====== 抓 RSS ====== */
function parseXml(txt){
  const d = new DOMParser().parseFromString(txt, 'text/xml');
  const items = [...d.querySelectorAll('item')].map(i => ({
    title: i.querySelector('title')?.textContent || '',
    link:  i.querySelector('link')?.textContent || '',
    date:  i.querySelector('pubDate')?.textContent || i.getElementsByTagName('dc:date')[0]?.textContent || ''
  })).filter(x => x.title);
  if(!items.length) throw new Error('empty');
  return items;
}
const getText = async u => { const r = await fetch(u); if(!r.ok) throw new Error(r.status); return r.text(); };
function fetchFeed(url){
  const e = encodeURIComponent(url);
  const ways = [
    (async () => { const j = await (await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + e)).json();
                   if(j.status !== 'ok' || !j.items?.length) throw 0;
                   return j.items.map(i => ({title:i.title, link:i.link, date:i.pubDate})); })(),
    (async () => { const j = await (await fetch('https://api.allorigins.win/get?url=' + e)).json(); return parseXml(j.contents); })(),
    (async () => parseXml(await getText('https://api.allorigins.win/raw?url=' + e)))(),
    (async () => parseXml(await getText('https://corsproxy.io/?url=' + e)))(),
    (async () => parseXml(await getText('https://api.codetabs.com/v1/proxy?quest=' + e)))(),
    (async () => parseXml(await getText('https://cors.eu.org/' + url)))(),
    (async () => parseXml(await getText(url)))()
  ];
  return timeout(any(ways), 15000);
}
function cleanItems(items, srcName){
  const seen = new Set(), out = [];
  for(const it of items){
    let title = (it.title || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim(), source = srcName;
    if(!srcName){ const k = title.lastIndexOf(' - '); if(k > 0){ source = title.slice(k + 3); title = title.slice(0, k); } }
    if(!title || seen.has(title)) continue;
    seen.add(title); out.push({title, source, link:it.link, date:it.date});
    if(out.length >= 20) break;
  }
  return out;
}
async function loadFeed(mode, cat, lang){
  for(const url of sourcesFor(mode, cat, lang)){
    try{ const items = cleanItems(await fetchFeed(url), SRC_NAME(url)); if(items.length >= 3) return items; }catch(e){}
  }
  throw new Error('no feed');
}

/* ====== 免費翻譯 ====== */
async function translate(text, sl, tl){
  const key = sl + '>' + tl + '|' + text;
  if(cache.tr[key]) return cache.tr[key];
  let res;
  try{
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&dt=rm&q=${encodeURIComponent(text)}`;
    const d = await timeout(fetch(u).then(r => r.json()), 10000);
    const segs = d[0] || [];
    const t = segs.filter(s => s[0]).map(s => s[0]).join('');
    const rmSeg = segs.find(s => !s[0] && (s[2] || s[3]));
    if(!t) throw 0;
    res = {t, rmT: rmSeg?.[2] || '', rmS: rmSeg?.[3] || ''};
  }catch(e){
    const d = await timeout(fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`).then(r => r.json()), 10000);
    if(!d.responseData?.translatedText) throw new Error('tr');
    res = {t: d.responseData.translatedText, rmT:'', rmS:''};
  }
  cache.tr[key] = res; saveCache();
  return res;
}
async function lookup(word, sl){
  try{
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=zh-TW&hl=zh-TW&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(word)}`;
    const d = await timeout(fetch(u).then(r => r.json()), 10000);
    const segs = d[0] || [];
    return { main: segs.filter(s => s[0]).map(s => s[0]).join(''),
             rm: segs.find(s => !s[0] && s[3])?.[3] || '',
             dict:(d[1] || []).map(p => ({pos:p[0], terms:(p[1] || []).slice(0, 6)})) };
  }catch(e){
    try{
      const d = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=${sl}|zh-TW`).then(r => r.json());
      return {main: d.responseData.translatedText, rm:'', dict: []};
    }catch(e2){ return {main:'（查詢失敗，請稍後再試）', rm:'', dict:[]}; }
  }
}

/* ====== 難字 ====== */
function isHard(w, lang){
  if(lang !== 'en' || /^[A-Z]/.test(w)) return false;
  const lw = w.toLowerCase().replace(/[’']s$/, '');
  if(lw.length <= 4) return false;
  const forms = [lw, lw.replace(/s$/,''), lw.replace(/es$/,''), lw.replace(/ies$/,'y'), lw.replace(/ed$/,''), lw.replace(/d$/,''),
                 lw.replace(/ing$/,''), lw.replace(/ing$/,'e'), lw.replace(/ly$/,''), lw.replace(/er$/,''), lw.replace(/ers$/,'')];
  return !forms.some(f => COMMON.has(f) || (f.length <= 4 && f !== lw));
}
function wordify(text, lang){
  if(!LANGS[lang].words) return esc(text);
  return text.split(/([\p{L}][\p{L}'’\-]*)/u).map((p, i) =>
    i % 2 ? `<span class="w${isHard(p, lang) ? ' hard' : ''}" data-w="${esc(p)}">${esc(p)}</span>` : esc(p)).join('');
}

/* ====== 朗讀 ====== */
function speak(text, lang, rate = 1){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const tts = cfg(lang).tts;
    u.lang = tts; u.rate = rate;
    const vs = speechSynthesis.getVoices(), norm = x => x.lang.replace('_','-').toLowerCase();
    const v = vs.find(v => norm(v) === tts.toLowerCase()) || vs.find(v => norm(v).startsWith(tts.slice(0, 2)));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

     : LANGS[lang].words ? `點任何一個字，都能看中文解釋、聽發音。` : `斜體字是羅馬拼音，按 🔊 可以聽整句發音。`);
  const tag = `<span class="tag">${LANGS[lang].short}</span>`;

    <article class="card" data-i="${i}" data-orig="${esc(it.title)}" ${native ? `data-text="${esc(it.title)}"` : ''}>
      <div class="meta"><span><span class="num">${String(i + 1).padStart(2, '0')}</span>${esc(it.source)}</span><span>${fmtTime(it.date)}</span></div>
      ${native
        ? `<div class="tr" style="border-top:none;padding-top:4px">${tag}<span class="tx">${wordify(it.title, lang)}</span></div>
           <div class="rm"></div>
           <div class="zh zhb ${state.showZh ? '' : 'hidden'}"><span class="skel"></span></div>`
        : `<div class="zh ${state.showZh ? '' : 'hidden'}">${esc(it.title)}</div>
           <div class="tr">${tag}<span class="tx"><span class="skel"></span></span></div>
           <div class="rm"></div>`}
      <div class="ents hidden"></div>
      <div class="acts">
        <button data-say="1">🔊 朗讀</button><button data-say="0.6">🐢 慢速</button><button data-ent="1">🔍 名詞解釋</button>
        <a href="${esc(it.link)}" target="_blank" rel="noopener">原文 ↗</a>
      </div>
    </article>`).join('');
  $('#status').textContent = '翻譯中…';
  await pool(items.map((it, i) => async () => {
    const card = () => list.querySelector(`.card[data-i="${i}"]`);
    if(native){
      let r; try{ r = await translate(it.title, lang, 'zh-TW'); }catch(e){ r = {t:'（翻譯暫時失敗）', rmS:''}; }
      if(token !== renderToken || !card()) return;
      card().querySelector('.zhb').textContent = r.t;
      card().querySelector('.rm').textContent = LANGS[lang].words ? '' : (r.rmS || '');
    }else{
      let r; try{ r = await translate(it.title, 'zh-TW', lang); }catch(e){ r = {t:'（翻譯暫時失敗，按「↻ 重新抓取」再試）', rmT:''}; }
      if(token !== renderToken || !card()) return;
      card().dataset.text = r.t;
      card().querySelector('.tx').innerHTML = wordify(r.t, lang);
      card().querySelector('.rm').textContent = r.rmT || '';
    }
  }), 4);
  if(token === renderToken) $('#status').textContent = `${items.length} 則`;
}

/* ====== 名詞解釋：免費查維基百科（不用 AI） ====== */
const STOP = new Set('a an the of and or for to in on at by with from as is are was were be been after before over amid into than new says said say will would can could may might its it his her their our this that these those how why what who when where not no but up down out off more most first last just now about against under while during'.split(' '));
const NOT_ENT = new Set(['US','UK','TV','OK','AM','PM','I','A']);
function findEntities(text){
  const toks = text.split(/\s+/).filter(Boolean);
  const words = toks.map(t => t.replace(/^[^\p{L}\p{N}]+/u, '').replace(/[^\p{L}\p{N}.]+$/u, '').replace(/[’']s$/, '').replace(/\.$/, ''));
  const caps = words.filter(w => /^[A-Z]/.test(w)).length;
  const titleCase = caps / (words.length || 1) > 0.6;
  const isAcr = w => /^[A-Z][A-Z0-9&]{1,6}$/.test((w || '').replace(/\./g, ''));
  const isEnt = (w, i) => {
    if(!w) return false;
    if(isAcr(w)) return true;
    if(!/^[A-Z][a-z]/.test(w)) return false;
    const l = w.toLowerCase();
    if(STOP.has(l)) return false;
    if((titleCase || i === 0) && COMMON.has(l)) return false;
    return true;
  };
  const out = []; let cur = [];
  const flush = () => { if(cur.length){ out.push(cur.join(' ')); cur = []; } };
  toks.forEach((t, i) => {
    const w = words[i];
    if(/^["“‘(]/.test(t)) flush();
    if(isEnt(w, i)) cur.push(w);
    else if(cur.length && ['of','de','the','and','for','on'].includes(w) && isEnt(words[i + 1], i + 1)) cur.push(w);
    else flush();
    if(/[,:;?!"”)]$/.test(t)) flush();
  });
  flush();
  return [...new Set(out)].filter(e => !NOT_ENT.has(e) && e.length > 1).slice(0, 6);
}

const WIKI = 'https://en.wikipedia.org/w/api.php?format=json&origin=*&';
const WIKI_PROPS = 'action=query&redirects=1&prop=pageprops|langlinks|extracts&ppprop=disambiguation&lllang=zh&exintro=1&explaintext=1&exsentences=4';
const entCache = {};
async function wikiPage(title){
  const d = await timeout(fetch(WIKI + WIKI_PROPS + '&titles=' + encodeURIComponent(title)).then(r => r.json()), 10000);
  const p = Object.values(d.query?.pages || {})[0];
  if(!p || p.missing !== undefined || p.pageprops?.disambiguation !== undefined) return null;
  return p;
}
const toTW = async t => { if(!t) return ''; try{ return (await translate(t, 'zh-CN', 'zh-TW')).t; }catch(e){ return t; } };
async function explainEntity(ent, headline){
  const key = ent + '|' + headline;
  if(entCache[key]) return entCache[key];
  // 1. 直接查（自動跟隨縮寫的轉址，例如 NATO → 北大西洋公約組織）
  let p = await wikiPage(ent).catch(() => null);
  // 2. 縮寫有多種意思時，用標題裡其他字當線索去搜尋，找出「在這則新聞裡」的意思
  if(!p){
    const ctx = headline.split(/\s+/).map(w => w.replace(/[^\p{L}]/gu, ''))
      .filter(w => w.length > 4 && !ent.includes(w) && !STOP.has(w.toLowerCase())).slice(0, 3).join(' ');
    const s = await timeout(fetch(WIKI + 'action=query&list=search&srlimit=5&srsearch=' + encodeURIComponent(ent + ' ' + ctx)).then(r => r.json()), 10000).catch(() => null);
    for(const h of (s?.query?.search || [])){
      if(/disambiguation/i.test(h.title)) continue;
      p = await wikiPage(h.title).catch(() => null);
      if(p) break;
    }
  }
  if(!p) return entCache[key] = {ent, none:true};
  const zhTitleRaw = p.langlinks?.[0]?.['*'] || '';
  let zhText = '';
  if(zhTitleRaw){
    try{
      const d = await timeout(fetch('https://zh.wikipedia.org/w/api.php?format=json&origin=*&action=query&prop=extracts&exintro=1&explaintext=1&exsentences=4&titles=' + encodeURIComponent(zhTitleRaw)).then(r => r.json()), 10000);
      zhText = Object.values(d.query?.pages || {})[0]?.extract || '';
    }catch(e){}
  }
  const [zhTitle, zhBody] = await Promise.all([toTW(zhTitleRaw), zhText ? toTW(zhText) : (p.extract ? translate(p.extract.slice(0, 700), 'en', 'zh-TW').then(r => r.t).catch(() => '') : '')]);
  return entCache[key] = {
    ent, en:p.title, zh:zhTitle, text:zhBody,
    isAcr: /^[A-Z][A-Z0-9&.]{1,7}$/.test(ent) && p.title.replace(/\s/g, '') !== ent,
    url: zhTitleRaw ? 'https://zh.wikipedia.org/zh-tw/' + encodeURIComponent(zhTitleRaw) : 'https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title),
    news: 'https://news.google.com/search?q=' + encodeURIComponent(p.title) + '&hl=zh-TW&gl=TW&ceid=TW:zh-Hant'
  };
}
async function englishOf(card){
  const orig = card.dataset.orig, {mode, lang} = state;
  if(mode === 'native') return lang === 'en' ? orig : (await translate(orig, lang, 'en')).t;
  return lang === 'en' && card.dataset.text ? card.dataset.text : (await translate(orig, 'zh-TW', 'en')).t;
}
async function toggleEnts(card){
  const box = card.querySelector('.ents');
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  if(box.dataset.done) return;
  box.innerHTML = `<div class="ent-h">🔍 名詞解釋</div><div class="skel"></div>`;
  let en = '';
  try{ en = await englishOf(card); }catch(e){}
  const ents = findEntities(en);
  if(!ents.length){ box.innerHTML = `<div class="ent-h">🔍 名詞解釋</div><div class="ent-n">這則標題沒有找到需要解釋的專有名詞或縮寫。</div>`; box.dataset.done = 1; return; }
  const res = await Promise.all(ents.map(e => explainEntity(e, en).catch(() => ({ent:e, none:true}))));
  const found = res.filter(r => !r.none);
  box.innerHTML = `<div class="ent-h">🔍 名詞解釋 <small>資料來源：維基百科</small></div>` +
    (found.length ? found.map(r => `
      <div class="ent">
        <div class="ent-t"><b>${esc(r.ent)}</b>${r.zh ? `　${esc(r.zh)}` : ''}</div>
        ${r.isAcr ? `<div class="ent-full">全稱：${esc(r.en)}</div>` : (r.en !== r.ent ? `<div class="ent-full">英文：${esc(r.en)}</div>` : '')}
        <div class="ent-d">${esc(r.text || '（維基百科沒有摘要）')}</div>
        <div class="ent-l"><a href="${r.url}" target="_blank" rel="noopener">維基百科全文 ↗</a><a href="${r.news}" target="_blank" rel="noopener">相關新聞 ↗</a></div>
      </div>`).join('') : '') +
    (res.length > found.length ? `<div class="ent-n">查不到：${res.filter(r => r.none).map(r => esc(r.ent)).join('、')}</div>` : '');
  box.dataset.done = 1;
}

/* ====== GitHub 用量 ====== */
async function openGitHub(){
  const el = $('#gh'); openSheet(el);
  const pageKB = Math.round(new Blob([document.documentElement.outerHTML]).size / 1024);
  let localKB = 0;
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); localKB += (k.length + (localStorage.getItem(k) || '').length) * 2; } }catch(e){}
  localKB = Math.round(localKB / 1024);
  const vocabN = store.get('nl_vocab', []).length;
  el.innerHTML = `<div class="hd"><span class="big">📊 GitHub 用量</span><button class="x" data-close>×</button></div><div class="skel" style="margin-top:10px"></div>`;
  let repo = null;
  try{ repo = await timeout(fetch('https://api.github.com/repos/' + REPO).then(r => r.ok ? r.json() : null), 10000); }catch(e){}
  const sizeKB = repo?.size ?? null;               // GitHub 回報的是 KB
  const pct = sizeKB != null ? Math.max(0.01, sizeKB / (1024 * 1024) * 100) : null;
  const opens = Math.round(100 * 1024 * 1024 / Math.max(pageKB, 1));
  const bar = p => `<div class="meter"><span style="width:${Math.min(100, p)}%"></span></div>`;
  el.innerHTML = `
    <div class="hd"><span class="big">📊 GitHub 用量</span><button class="x" data-close>×</button></div>
    <div class="gh-sec">
      <div class="gh-t">儲存空間 <small>上限 1 GB</small></div>
      ${sizeKB != null ? `${bar(pct)}<div class="gh-n">已用 <b>${sizeKB < 1024 ? sizeKB + ' KB' : (sizeKB / 1024).toFixed(1) + ' MB'}</b>（約 ${pct.toFixed(2)}%）${pct < 50 ? ' · ✅ 很安全' : pct < 90 ? ' · ⚠️ 留意' : ' · ❌ 快滿了'}</div>`
                       : `<div class="gh-n">暫時讀不到（GitHub 每小時限查 60 次，稍後再試）</div>`}
    </div>
    <div class="gh-sec">
      <div class="gh-t">網路流量 <small>上限每月約 100 GB</small></div>
      <div class="gh-n">這個網頁約 <b>${pageKB} KB</b>，每月大約可以打開 <b>${opens.toLocaleString()} 次</b>，自己用完全不會超過。</div>
      <div class="gh-n" style="color:var(--mute)">新聞和翻譯是你的手機直接向新聞網站、翻譯網站拿的，不經過 GitHub，也不算 GitHub 流量。GitHub 不公開 Pages 的實際流量數字；想看有多少人來訪，可以登入後看 <a href="https://github.com/${REPO}/graphs/traffic" target="_blank" rel="noopener">流量統計 ↗</a>。</div>
    </div>
    <div class="gh-sec">
      <div class="gh-t">資料存在哪裡？</div>
      <div class="gh-n">GitHub 上<b>只有這一個網頁檔</b>。你看過的新聞、翻譯、單字本都<b>不會</b>存到 GitHub，所以不會讓它變滿。</div>
      <div class="gh-n">今天的新聞暫存和單字本只存在<b>這支手機的瀏覽器</b>裡（目前約 ${localKB} KB）。新聞暫存每天自動清空；單字本有 ${vocabN} 個字，每個字約 0.3 KB，瀏覽器大約可存 1 萬個字以上。</div>
      <div class="acts" style="margin-top:8px"><button data-clear="cache">清除今天的新聞暫存</button><button data-clear="vocab">清空單字本</button></div>
    </div>
    ${repo ? `<div class="gh-n" style="color:var(--mute);margin-top:8px">最後更新：${fmtTime(repo.pushed_at)} · <a href="${repo.html_url}" target="_blank" rel="noopener">GitHub 專案 ↗</a></div>` : ''}`;
}
let clearArm = '';
function clearLocal(what){
  const btn = document.querySelector(`[data-clear="${what}"]`);
  if(clearArm !== what){ clearArm = what; btn.textContent = '再按一次確認'; return; }
  clearArm = '';
  if(what === 'cache'){ cache = {date:today, feeds:{}, tr:{}}; saveCache(); btn.textContent = '已清除 ✓'; }
  else { store.set('nl_vocab', []); updateCount(); btn.textContent = '已清空 ✓'; }
}

/* ====== 單字本 ====== */
function updateCount(){ const n = store.get('nl_vocab', []).length; $('#vcount').textContent = n ? `· ${n}` : ''; }
let vocabBook = null;
function openVocab(book){
  const all = store.get('nl_vocab', []), el = $('#vocab');
  openSheet(el);
  const counts = {}; all.forEach(x => counts[x.lang] = (counts[x.lang] || 0) + 1);
  vocabBook = book || vocabBook || (counts[state.lang] ? state.lang : (Object.keys(counts)[0] || state.lang));
  const items = all.map((x, i) => ({...x, i})).filter(x => x.lang === vocabBook);
  const L = LANGS[vocabBook];
  el.style.borderTopColor = `var(--${vocabBook})`;
  el.innerHTML = `<div class="hd"><span class="big">📒 單字本</span><button class="x" data-close>×</button></div>
    <div class="vtabs">${Object.entries(LANGS).map(([k, l]) =>
      `<button data-vbook="${k}" class="${k === vocabBook ? 'on' : ''}" style="${k === vocabBook ? 'background:var(--' + k + ')' : ''}">${l.name} ${counts[k] || 0}</button>`).join('')}</div>
    ${items.length ? '' : `<div class="msg">${L.name} 單字本還是空的。<br>點新聞裡的字，再按「☆ 加入單字本」。</div>`}
    ${items.map(x => `<div class="vi"><div><b>${esc(x.w)}</b> <small>${x.d}</small><br>${esc(x.m)}<br><small>${esc(x.ctx)}</small></div>
      <div style="display:flex;flex-direction:column;gap:5px"><button class="sbtn" data-vsay="${x.i}">🔊</button><button class="sbtn" data-vdel="${x.i}">刪除</button></div></div>`).join('')}
    ${items.length ? `<div class="acts" style="margin-top:12px"><button id="vCopy">複製 ${L.name} 單字（${items.length}）</button></div>` : ''}`;
  const c = $('#vCopy');
  if(c) c.onclick = async () => { try{ await navigator.clipboard.writeText(items.map(x => `${x.w}\t${x.m}`).join('\n')); c.textContent = '已複製 ✓'; }catch(e){ c.textContent = '無法複製'; } };
}

/* ====== 深淺色 ====== */
const THEMES = {auto:'🌗 自動', light:'☀️ 淺色', dark:'🌙 深色'};
function applyTheme(){
  const th = store.get('nl_theme', 'auto');
  document.documentElement.dataset.theme = th;
  $('#themeBtn').textContent = THEMES[th] || THEMES.auto;
  const dark = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#1b1c1e' : '#f4f1ea';
}
$('#themeBtn').onclick = () => { const ks = Object.keys(THEMES); store.set('nl_theme', ks[(ks.indexOf(store.get('nl_theme', 'auto')) + 1) % ks.length]); applyTheme(); };
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
applyTheme();

/* ====== 事件 ====== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-vbook],[data-ent],#ghBtn,[data-clear],[data-mode],[data-cat],[data-lang],[data-close],[data-say],.w,[data-vdel],[data-vsay],#shade');
  if(!t) return;
  if(t.id === 'shade' || t.dataset.close !== undefined) closeSheets();
  else if(t.dataset.vbook){ openVocab(t.dataset.vbook); }
  else if(t.dataset.ent){ toggleEnts(t.closest('.card')); }
  else if(t.id === 'ghBtn'){ openGitHub(); }
  else if(t.dataset.clear){ clearLocal(t.dataset.clear); }
  else if(t.dataset.mode){ state.mode = t.dataset.mode; store.set('nl_mode', state.mode); renderNav(); render(); }
  else if(t.dataset.cat){ state.cat = t.dataset.cat; store.set('nl_cat2', state.cat); renderNav(); render(); window.scrollTo({top:0}); }
  else if(t.dataset.lang){ state.lang = t.dataset.lang; store.set('nl_lang', state.lang); renderNav(); render(); }
  else if(t.dataset.say){ const c = t.closest('.card'); if(c.dataset.text) speak(c.dataset.text, state.lang, +t.dataset.say); }
  else if(t.classList.contains('w')){ openWord(t.dataset.w, t.closest('.card').dataset.text || ''); }
  else if(t.dataset.vdel !== undefined){ const v = store.get('nl_vocab', []); v.splice(+t.dataset.vdel, 1); store.set('nl_vocab', v); updateCount(); openVocab(); }
  else if(t.dataset.vsay !== undefined){ const x = store.get('nl_vocab', [])[+t.dataset.vsay]; if(x) speak(x.w, x.lang, 0.8); }
});
$('#showZh').onchange = e => { state.showZh = e.target.checked; store.set('nl_zh', state.showZh); document.querySelectorAll('.zh').forEach(z => z.classList.toggle('hidden', !state.showZh)); };
$('#region').onchange = e => { state.region = e.target.value; store.set('nl_region', state.region); renderNav(); render(); };
$('#count').onchange = e => { state.count = +e.target.value; store.set('nl_count', state.count); render(); };
$('#refresh').onclick = () => render(true);
$('#vocabBtn').onclick = () => openVocab(state.lang);
try{ speechSynthesis.getVoices(); }catch(e){}

const wk = new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei', weekday:'long'}).format(new Date());
$('#date').innerHTML = `${today.replace(/-/g, '.')}<br>${wk}`;
renderNav(); updateCount(); render();
</script>
