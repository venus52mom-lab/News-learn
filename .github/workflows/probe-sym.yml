name: probe-sym
on: {push: {paths: [".github/workflows/probe-sym.yml"]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in %E7%92%B0%E7%90%83%E6%99%B6 toyota tesla %E9%A8%B0%E8%A8%8A; do echo "== $q"; curl -s -m 20 "https://ess.api.cnyes.com/ess/api/v1/siteSearch/main?q=$q&limit=5" | python3 -c "import json,sys;d=json.load(sys.stdin)['data'];print({k:(len(v) if isinstance(v,list) else v) for k,v in d.items()});[print(k,json.dumps(v[:3],ensure_ascii=False)[:600]) for k,v in d.items() if isinstance(v,list) and k!='news' and v]"; done
