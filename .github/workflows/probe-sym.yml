name: probe-sym
on: {push: {paths: [".github/workflows/probe-sym.yml"]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://venus52mom-lab.github.io"
          for u in "https://isin.twse.com.tw/isin/C_public.jsp?strMode=2" "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" "https://openapi.twse.com.tw/v1/opendata/t187ap03_L" "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes" "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O" "https://www.twse.com.tw/rwd/zh/api/codeQuery?query=%E7%92%B0%E7%90%83" "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw|otc_6488.tw&json=1" "https://tw.stock.yahoo.com/_td-stock/api/resource/AutocompleteService;query=%E7%92%B0%E7%90%83" "https://www.wantgoo.com/investrue/all-alive" "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo" "https://histock.tw/stock/module/stockdata.aspx"; do echo "== $u"; curl -s -m 25 -D h -o b -H "$O" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" "$u"; grep -i "^HTTP\|access-control-allow-origin\|content-type" h; echo "size $(wc -c <b)"; head -c 300 b | iconv -f big5 -t utf-8 2>/dev/null || head -c 300 b; echo; done
