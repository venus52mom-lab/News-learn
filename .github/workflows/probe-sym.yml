name: probe-sym
on: {push: {paths: [".github/workflows/probe-sym.yml"]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          A="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          t(){ echo "== $1"; curl -s -m 20 -A "$A" -o b -w "%{http_code} %{size_download}\n" "$1"; python3 -c "
          import json,sys;s=open('b').read()
          try:
            r=json.loads(s)['chart']['result'][0];print('pts',len(r.get('timestamp') or []))
          except Exception: print(s[:300])"; }
          for q in "period1=1600000000&period2=1800000000&interval=1d" "period1=1600000000&period2=1800000000&interval=1wk" "range=5y&interval=1wk" "range=3mo&interval=1h"; do t "https://query2.finance.yahoo.com/v8/finance/chart/EU500.AS?$q"; done
          for s in EU500.PA ^EU500 N500.AS EUR500.AS; do t "https://query2.finance.yahoo.com/v8/finance/chart/$s?range=1y&interval=1d"; done
          for s in GI:EU500:INDEX GI:N500:INDEX GI:EURONEXT500:INDEX GI:N100:INDEX GI:SXXP:INDEX; do t "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/$s"; done
          t "https://ws.api.cnyes.com/ws/api/v1/charting/history?resolution=D&symbol=GI:CSI300:INDEX&from=1795600000&to=1700000000"
          t "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.000300&fields1=f1&fields2=f51,f53&klt=101&fqt=0&beg=0&end=20500101"
          t "https://www.euronext.com/en/markets/indices"
