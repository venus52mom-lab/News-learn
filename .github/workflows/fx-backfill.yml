name: 匯率 - 抓完整歷史（第一次手動跑一次）
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fx-data
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fx-rates/scripts/fetch_bot.py backfill
      - name: Commit
        if: always()
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add fx-rates/data
          git diff --cached --quiet || (git commit -m "歷史匯率回補" && git pull --rebase && git push)
