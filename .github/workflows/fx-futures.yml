name: 匯率 - 台指期、股市、新聞（每小時）
# App 上有鉅亨網代號的項目會直接即時更新；這個排程每小時存一份
# 台指期備援、其他市場（日經、VIX、比特幣…）與各項目的相關新聞。
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fx-rates/scripts/fetch_futures.py", "fx-rates/scripts/fetch_markets.py", "fx-rates/scripts/fetch_news.py", ".github/workflows/fx-futures.yml"]
permissions:
  contents: write
concurrency:
  group: fx-data
  cancel-in-progress: false
jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 fx-rates/scripts/fetch_futures.py || true
      - run: python3 fx-rates/scripts/fetch_markets.py || true
      - run: python3 fx-rates/scripts/fetch_news.py || true
      - name: Commit
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add fx-rates/data/txf.json fx-rates/data/markets.json fx-rates/data/mkt fx-rates/data/news.json
          git diff --cached --quiet || (git commit -m "台指期備援・股市・新聞 $(TZ=Asia/Taipei date '+%F %R')" && git pull --rebase && git push)
