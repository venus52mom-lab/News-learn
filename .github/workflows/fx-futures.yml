name: 匯率 - 台指期備援資料
# App 平常直接向鉅亨網拿即時報價；這個排程每小時存一份備援，鉅亨網掛掉時 App 改讀它。
on:
  schedule:
    # 台灣時間 週一 08:00 ～ 週六 05:00，每小時（涵蓋日盤與夜盤）
    - cron: "17 0-21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fx-rates/scripts/fetch_futures.py", ".github/workflows/fx-futures.yml"]
permissions:
  contents: write
concurrency:
  group: fx-data
  cancel-in-progress: false
jobs:
  futures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fx-rates/scripts/fetch_futures.py
      - name: Commit
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add fx-rates/data/txf.json
          git diff --cached --quiet || (git commit -m "台指期備援 $(TZ=Asia/Taipei date '+%F %R')" && git pull --rebase && git push)
