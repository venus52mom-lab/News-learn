name: 匯率 - 更新匯率
on:
  schedule:
    # 台灣時間週一到週五 09:05–17:35，每 30 分鐘（GitHub 排程可能延遲幾分鐘）
    - cron: "5,35 1-9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fx-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fx-rates/scripts/fetch_bot.py update
      - name: Commit
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add fx-rates/data
          git diff --cached --quiet || (git commit -m "匯率更新 $(TZ=Asia/Taipei date '+%F %R')" && git pull --rebase && git push)
