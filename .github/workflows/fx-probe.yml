name: 匯率 - 測試資料來源
on:
  push:
    branches: [main]
    paths: ["fx-rates/tmp/probe_fut.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fx-rates/tmp/probe_fut.py
      - run: |
          git config user.name "fx-bot"; git config user.email "fx-bot@users.noreply.github.com"
          git add fx-rates/tmp; git commit -m "期貨來源測試" && git pull --rebase && git push
