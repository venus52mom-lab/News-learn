name: 匯率 - 測試資料來源
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fx-rates/scripts/probe_sources.py", ".github/workflows/fx-probe.yml"]
permissions:
  contents: write
concurrency:
  group: fx-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fx-rates/scripts/probe_sources.py
      - name: Commit
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add fx-rates/data/probe.json fx-rates/data/probe_raw || true
          git diff --cached --quiet || (git commit -m "匯率來源測試 $(TZ=Asia/Taipei date '+%F %R')" && git pull --rebase && git push)
