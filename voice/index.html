<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="錄音聊天">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3c4660">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>錄音聊天</title>
<style>
:root{
  --navy:#3c4660;--navy2:#2f374c;--sky:#87a0c4;--ink:#111;--sub:#8a8f99;--card:#fff;
  --green:#06c755;--red:#ff3b30;--me:#8de055;--you:#fff;--youInk:#111;--sheet:#fff;--pill:#f2f3f5;--line:#e6e8ec;
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --navy:#252b3b;--navy2:#1c2130;--sky:#4d6283;--ink:#f2f2f2;--sub:#9a9fa8;--card:#282c38;
  --me:#5fb33a;--you:#2c2f38;--youInk:#f2f2f2;--sheet:#1f2330;--pill:#2c3140;--line:#333a4a;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--sky) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20400%20800%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22b%22%20x%3D%22-50%25%22%20y%3D%22-50%25%22%20width%3D%22200%25%22%20height%3D%22200%25%22%3E%3CfeGaussianBlur%20stdDeviation%3D%2210%22/%3E%3C/filter%3E%3Cfilter%20id%3D%22c%22%20x%3D%22-50%25%22%20y%3D%22-50%25%22%20width%3D%22200%25%22%20height%3D%22200%25%22%3E%3CfeGaussianBlur%20stdDeviation%3D%226%22/%3E%3C/filter%3E%3C/defs%3E%3Cg%20fill%3D%22%23fff%22%20filter%3D%22url%28%23b%29%22%20opacity%3D%22.42%22%3E%3Cellipse%20cx%3D%22320%22%20cy%3D%2270%22%20rx%3D%2270%22%20ry%3D%2218%22/%3E%3Cellipse%20cx%3D%2290%22%20cy%3D%22250%22%20rx%3D%2290%22%20ry%3D%2240%22/%3E%3Cellipse%20cx%3D%22150%22%20cy%3D%22300%22%20rx%3D%2270%22%20ry%3D%2245%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%22330%22%20rx%3D%2260%22%20ry%3D%2230%22/%3E%3Cellipse%20cx%3D%22330%22%20cy%3D%22640%22%20rx%3D%22110%22%20ry%3D%2260%22/%3E%3Cellipse%20cx%3D%22380%22%20cy%3D%22590%22%20rx%3D%2260%22%20ry%3D%2250%22/%3E%3Cellipse%20cx%3D%22200%22%20cy%3D%22720%22%20rx%3D%22130%22%20ry%3D%2250%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%22760%22%20rx%3D%2290%22%20ry%3D%2240%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23fff%22%20filter%3D%22url%28%23c%29%22%20opacity%3D%22.35%22%3E%3Cellipse%20cx%3D%22300%22%20cy%3D%2260%22%20rx%3D%2230%22%20ry%3D%229%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%22270%22%20rx%3D%2240%22%20ry%3D%2222%22/%3E%3Cellipse%20cx%3D%22340%22%20cy%3D%22620%22%20rx%3D%2250%22%20ry%3D%2226%22/%3E%3Cellipse%20cx%3D%22230%22%20cy%3D%22700%22%20rx%3D%2260%22%20ry%3D%2220%22/%3E%3C/g%3E%3C/svg%3E") center/cover no-repeat}
.view[hidden]{display:none}

/* 上方深色列 */
.head{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 6px}
.pills{display:flex;gap:2px}
.pills button{padding:7px 14px;border-radius:20px;font-size:17px;font-weight:800;color:rgba(255,255,255,.6)}
.pills button.on{background:rgba(255,255,255,.16);color:#fff}
.icons{display:flex}
.icons button{width:42px;height:42px;display:grid;place-items:center;color:#fff}
.icons svg{width:23px;height:23px}
.search{margin:2px 12px 10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border-radius:12px;padding:0 12px;height:38px;color:rgba(255,255,255,.7)}
.search input{flex:1;border:0;background:none;font-size:16px;color:#fff;outline:none}
.search input::placeholder{color:rgba(255,255,255,.55)}
.search svg{width:18px;height:18px;flex:none}

/* 對話框列表 */
#list{list-style:none;margin:0;padding:10px 0 110px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.item{position:relative;overflow:hidden;margin:0 12px 8px;border-radius:18px;box-shadow:0 2px 8px rgba(30,45,80,.12)}
.acts{position:absolute;inset:0 0 0 auto;display:flex}
.acts button{width:76px;color:#fff;font-size:15px;font-weight:600}
.acts .ren{background:#9aa1ad}.acts .del{background:var(--red)}
.fg{position:relative;display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--card);touch-action:pan-y;transition:transform .22s ease;user-select:none;-webkit-user-select:none;border-radius:18px}
.fg.drag{transition:none}
.av{position:relative;width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.av svg{width:24px;height:24px}
.av .tag{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#3b82f6;border:2px solid #fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.mid{flex:1;min-width:0}
.ttl{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{font-size:14px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.rt{align-self:flex-start;display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:3px}
.tm{font-size:12px;color:var(--sub);white-space:nowrap}
.badge{background:var(--green);color:#fff;font-size:12px;font-weight:700;border-radius:11px;padding:1px 8px}
.empty{text-align:center;color:#fff;padding:90px 30px;line-height:1.7;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.empty b{display:block;font-size:18px;margin-bottom:4px}

/* 小小的錄音、錄影鍵 */
.dock{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:10px}
.rbtn{width:46px;height:46px;border-radius:50%;background:rgba(40,48,68,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.rbtn svg{width:21px;height:21px}
.rbtn::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);transform:translate(13px,-13px)}

/* 聊天室 */
.bar{display:flex;align-items:center;gap:4px;padding:6px 6px 6px}
.bar button{width:42px;height:42px;display:grid;place-items:center;color:#fff}
.bar svg{width:23px;height:23px}
.bar h1{flex:1;font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
#msgs{flex:1;overflow-y:auto;padding:10px 12px 20px;-webkit-overflow-scrolling:touch}
.chip{display:table;margin:6px auto 14px;background:rgba(0,0,0,.18);color:#fff;font-size:12px;border-radius:12px;padding:3px 12px}
.row{display:flex;align-items:flex-end;gap:6px;margin:10px 0}
.row.me{justify-content:flex-end}
.meta{font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.row.me .meta{text-align:right}
.bub{max-width:78%;border-radius:20px;padding:10px 14px;font-size:16px;line-height:1.5;word-break:break-word;white-space:pre-wrap;position:relative}
.me .bub{background:var(--me);color:#10200a;border-top-right-radius:6px}
.you .bub{background:var(--you);color:var(--youInk);border-top-left-radius:6px}
.mini{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;align-self:flex-start;color:#fff;font-size:12px;font-weight:800}
.lbl{font-size:12px;font-weight:700;opacity:.55;margin-bottom:2px;white-space:normal}
.tools{display:flex;gap:14px;margin-top:6px;white-space:normal}
.tools button{font-size:13px;color:#3b82f6;padding:4px 0}
.voice{display:flex;align-items:center;gap:10px;min-width:200px}
.play{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.12);display:grid;place-items:center;flex:none}
.play svg{width:17px;height:17px}
.prog{flex:1;height:26px;position:relative;touch-action:none}
.prog .wave{position:absolute;inset:0;display:flex;align-items:center;gap:2px}
.prog .wave i{flex:1;background:rgba(0,0,0,.25);border-radius:2px}
.prog .wave i.on{background:rgba(0,0,0,.7)}
.dur{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vbub{padding:4px!important;overflow:hidden}
.vbub video{display:block;width:100%;max-width:260px;max-height:46vh;border-radius:16px;background:#000}
.typing{display:flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
.pbar{height:6px;background:rgba(0,0,0,.1);border-radius:3px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.tb{display:flex;gap:8px;overflow-x:auto;padding:9px 12px calc(env(safe-area-inset-bottom) + 9px);background:var(--navy)}
.tb button{flex:none;padding:8px 14px;border-radius:18px;background:rgba(255,255,255,.13);color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.tb button.pri{background:var(--green)}
.tb button:disabled{opacity:.4}

/* 底部面板、對話框 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mask[hidden]{display:none}
.sheet{width:100%;max-width:520px;background:var(--sheet);border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 6px;font-size:18px;text-align:center}
.sheet p{color:var(--sub);font-size:14px;line-height:1.6;margin:6px 0 14px;text-align:center;white-space:pre-line}
.sheet input,.sheet textarea,.sheet select{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--pill);color:var(--ink);font-family:inherit}
.sheet textarea{min-height:200px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:13px;border-radius:14px;background:var(--pill);font-weight:700;font-size:16px}
.btns .ok{background:var(--green);color:#fff}.btns .danger{background:var(--red);color:#fff}
/* 錄音中：精簡深色小條 */
.mask.recm{background:transparent;pointer-events:none}
.recbar{pointer-events:auto;width:calc(100% - 24px);max-width:480px;margin-bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(28,33,48,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border-radius:22px;padding:10px;animation:up .2s ease}
.recrow{display:flex;align-items:center;gap:10px}
.recrow .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.7)}
.recrow .x svg{width:18px;height:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:b 1s infinite;flex:none}
.clock{font-size:16px;font-variant-numeric:tabular-nums;width:44px}
#meter{flex:1;height:30px;display:block}
.stop{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;flex:none}
.stop i{width:14px;height:14px;border-radius:3px;background:var(--red)}
#pv{width:100%;max-height:40vh;border-radius:14px;background:#000;display:block;object-fit:cover;margin-bottom:8px}
.flip{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.flip svg{width:18px;height:18px}
.pvw{position:relative}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:50vh;overflow-y:auto}
.langs button{padding:12px 6px;border-radius:12px;background:var(--pill);font-size:15px;font-weight:600}
.langs button.on{background:var(--green);color:#fff}
.opt{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt label{font-size:14px;font-weight:700}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- 列表 -->
<section class="view" id="home">
  <div class="head"><div class="top">
    <div class="pills"><button class="on" data-f="all">錄音</button><button data-f="txt">有文字</button></div>
    <div class="icons">
      <button id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button id="plusBtn" aria-label="新錄音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button>
    </div>
  </div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="搜尋標題或文字內容"></label></div>
  <ul id="list"></ul>
  <div class="dock"><button class="rbtn" id="recBtn" aria-label="錄音"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button class="rbtn" id="vidBtn" aria-label="錄影"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M17 10l5-3v10l-5-3z"/></svg></button></div>
</section>

<!-- 聊天室 -->
<section class="view" id="chat" hidden>
  <div class="head bar">
    <button id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="cTitle"></h1>
    <button id="shareBtn" aria-label="分享音檔"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <button id="renBtn" aria-label="重新命名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
  </div>
  <div id="msgs"></div>
  <div class="tb">
    <button class="pri" id="sttBtn">提取文字</button>
    <button data-tl="en">翻成英文</button>
    <button data-tl="zh-TW">翻成中文</button>
    <button id="moreLang">其他語言</button>
  </div>
</section>

<div class="mask" id="mask" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<audio id="player" playsinline></audio>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#06c755','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#ec4899','#64748b'];
const colorOf=id=>COLORS[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const MIC='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const CAM='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M17 10l5-3v10l-5-3z"/></svg>';
const LANGS=[['zh-TW','繁體中文'],['zh-CN','简体中文'],['en','English'],['ja','日本語'],['ko','한국어'],['th','ไทย'],['vi','Tiếng Việt'],['id','Indonesia'],['ms','Melayu'],['tl','Filipino'],['es','Español'],['fr','Français'],['de','Deutsch'],['it','Italiano'],['pt','Português'],['ru','Русский'],['ar','العربية'],['hi','हिन्दी'],['tr','Türkçe'],['nl','Nederlands'],['pl','Polski'],['uk','Українська'],['km','ខ្មែរ'],['my','မြန်မာ']];
const langName=c=>(LANGS.find(l=>l[0]===c)||[c,c])[1];

let toastT;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)};

/* ---------- 設定 ---------- */
const S={model:'Xenova/whisper-base',sttLang:'zh'};
const SPOKEN=[['zh','中文','chinese'],['en','English','english'],['ja','日本語','japanese'],['ko','한국어','korean'],['th','ไทย','thai'],['vi','Tiếng Việt','vietnamese'],['id','Indonesia','indonesian'],['ms','Melayu','malay'],['tl','Filipino','tagalog'],['es','Español','spanish'],['fr','Français','french'],['de','Deutsch','german'],['it','Italiano','italian'],['pt','Português','portuguese'],['ru','Русский','russian'],['ar','العربية','arabic'],['hi','हिन्दी','hindi'],['tr','Türkçe','turkish']];
try{Object.assign(S,JSON.parse(localStorage.getItem('rc-set')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('rc-set',JSON.stringify(S))}catch(e){}};

/* ---------- IndexedDB ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('rec-chat',1);r.onupgradeneeded=()=>r.result.createObjectStore('recs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(mode,fn)=>new Promise((res,rej)=>{const t=db.transaction('recs',mode);const st=t.objectStore('recs');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)});
const allRecs=()=>tx('readonly',s=>s.getAll());
const putRec=r=>tx('readwrite',s=>s.put(r));
const delRec=id=>tx('readwrite',s=>s.delete(id));
let recs=[];

/* ---------- 時間格式（LINE 風格）---------- */
function fmtTime(ts){
  const d=new Date(ts),n=new Date();
  if(d.toDateString()!==n.toDateString()){return d.getFullYear()===n.getFullYear()?`${d.getMonth()+1}/${d.getDate()}`:`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
  return clock(d);
}
function clock(d){const h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');const p=h<12?'上午':h===12?'中午':h<18?'下午':'晚上';return `${p}${h%12||12}:${m}`}
const fmtDur=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

/* 左滑刪除 */
const OPEN=-152;let openFg=null;
function closeOpen(except){if(openFg&&openFg!==except){openFg.style.transform='';openFg=null}}
$('#list').addEventListener('pointerdown',e=>{
  const fg=e.target.closest('.fg');if(!fg)return;
  const base=fg===openFg?OPEN:0;let sx=e.clientX,sy=e.clientY,dx=0,mode=null;
  const move=ev=>{
    dx=ev.clientX-sx;const dy=ev.clientY-sy;
    if(!mode){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))mode='h';else if(Math.abs(dy)>8)mode='v'}
    if(mode==='h'){fg.classList.add('drag');closeOpen(fg);fg.style.transform=`translateX(${Math.min(0,Math.max(OPEN-40,base+dx))}px)`}
  };
  const up=()=>{
    removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    fg.classList.remove('drag');
    if(mode==='h'){const x=base+dx;if(x<OPEN/2.5){fg.style.transform=`translateX(${OPEN}px)`;openFg=fg}else{fg.style.transform='';if(openFg===fg)openFg=null}}
    else if(!mode){if(openFg){closeOpen()}else openChat(fg.parentElement.dataset.id)}
  };
  addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
});

  $('#mask').hidden=false;$('#mask').onclick=null;

function getStream(){const a={echoCancellation:true,noiseSuppression:true};return navigator.mediaDevices.getUserMedia(recKind==='video'?{audio:a,video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}}}:{audio:a})}

/* ---------- 語音轉文字：Whisper 在手機/電腦本機執行，不用 AI token ---------- */
let worker=null,pending=null;
const WORKER=`
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';
env.allowLocalModels=false;
let asr=null,cur=null;const files={};
self.onmessage=async e=>{
  const {audio,model,language}=e.data;
  try{
    if(!asr||cur!==model){
      self.postMessage({type:'status',msg:'第一次使用：下載辨識模型（之後會快取）'});
      asr=await pipeline('automatic-speech-recognition',model,{dtype:'q8',device:'wasm',progress_callback:p=>{
        if(p.status==='progress'&&p.total){files[p.file]=[p.loaded,p.total];let l=0,t=0;for(const k in files){l+=files[k][0];t+=files[k][1]}self.postMessage({type:'progress',pct:Math.round(l/t*100)})}
      }});cur=model;
    }
    self.postMessage({type:'status',msg:'辨識中，請稍候…'});self.postMessage({type:'progress',pct:0});
    const out=await asr(audio,{chunk_length_s:30,stride_length_s:5,task:'transcribe',language});
    self.postMessage({type:'done',text:(out.text||'').trim()});
  }catch(err){self.postMessage({type:'error',msg:String(err&&err.message||err)})}
};`;
function getWorker(){
  if(worker)return worker;
  worker=new Worker(URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'})),{type:'module'});
  worker.onmessage=e=>{const m=e.data;
    if(m.type==='status'){progMsg=m.msg;cur&&busy&&renderChat()}
    else if(m.type==='progress'){prog=m.pct;const b=document.querySelector('.pbar i');if(b)b.style.width=prog+'%';else if(cur&&busy)renderChat()}
    else if(m.type==='done'){pending&&pending.res(m.text);pending=null}
    else if(m.type==='error'){pending&&pending.rej(new Error(m.msg));pending=null}
  };
  worker.onerror=e=>{pending&&pending.rej(new Error(e.message||'模型載入失敗'));pending=null;worker=null};
  return worker;
}
async function decode16k(ab){
  const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();
  const buf=await new Promise((res,rej)=>{const p=ac.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
  ac.close&&ac.close();
  const off=new OfflineAudioContext(1,Math.ceil(buf.duration*16000),16000);
  const src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();
  const out=await off.startRendering();return out.getChannelData(0);
}
let cc=null;
async function toTrad(t){
  if(!/[一-鿿]/.test(t))return t;
  try{
    if(!cc){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});cc=OpenCC.Converter({from:'cn',to:'tw'})}
    return cc(t);
  }catch(e){return t}
}

async function runStt(lc){

/* ---------- 翻譯：免費翻譯服務，不用 AI token ---------- */
function chunkText(t,max){const parts=t.split(/(?<=[。！？!?\.\n])/);const out=[];let s='';for(const p of parts){if((s+p).length>max&&s){out.push(s);s=''}s+=p;while(s.length>max){out.push(s.slice(0,max));s=s.slice(max)}}if(s)out.push(s);return out}
async function gtx(text,tl){
  let res='';for(const c of chunkText(text,1500)){
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(c)}`);
    if(!r.ok)throw new Error('gtx '+r.status);const j=await r.json();res+=j[0].map(x=>x[0]).join('')}
  return res;
}
async function mymemory(text,tl){
  const sl=/[一-鿿]/.test(text)?'zh-TW':/[぀-ヿ]/.test(text)?'ja':/[가-힯]/.test(text)?'ko':'en';
  let res='';for(const c of chunkText(text,450)){
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(c)}&langpair=${sl}|${tl}`);const j=await r.json();
    if(j.responseStatus!==200)throw new Error(j.responseDetails||'翻譯失敗');res+=j.responseData.translatedText}
  return res;
}
async function translate(tl){
  const r=cur;if(!r||busy)return;
  if(!r.transcript){toast('請先按「提取文字」');return}
  busy='tr';renderChat();
  try{let t;try{t=await gtx(r.transcript,tl)}catch(e){t=await mymemory(r.transcript,tl)}
    r.translations=r.translations.filter(x=>x.tl!==tl);r.translations.push({tl,text:t});await putRec(r);
  }catch(e){modal({title:'翻譯失敗',text:'請確認網路連線後再試。'+e.message})}
  busy=null;if(cur===r)renderChat();
}
document.querySelectorAll('.tb [data-tl]').forEach(b=>b.onclick=()=>translate(b.dataset.tl));
$('#moreLang').onclick=()=>{
  if(!cur.transcript){toast('請先按「提取文字」');return}
  $('#sheet').className='sheet';$('#mask').classList.remove('recm');
  $('#sheet').innerHTML=`<h2>翻譯成…</h2><p>選擇要翻譯的語言</p><div class="langs">${LANGS.map(l=>`<button data-l="${l[0]}">${l[1]}</button>`).join('')}</div><div class="btns"><button id="lx">取消</button></div>`;
  $('#mask').hidden=false;$('#mask').onclick=e=>{if(e.target.id==='mask')$('#mask').hidden=true};
  $('#lx').onclick=()=>$('#mask').hidden=true;
  $('#sheet').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{$('#mask').hidden=true;translate(b.dataset.l)});
};

/* ---------- 設定 ---------- */
$('#setBtn').onclick=async()=>{
  let used='';try{const e=await navigator.storage.estimate();used=`目前使用約 ${(e.usage/1048576).toFixed(1)} MB`}catch(e){}
  const v=await modal({title:'設定',html:`<div class="opt"><label>語音辨識模型（在本機執行，不花 AI token）</label><select id="mSel">
    <option value="Xenova/whisper-tiny">快速（約 40 MB，準確度較低）</option>
    <option value="Xenova/whisper-base">標準（約 80 MB，中英文較準）</option></select></div>
    <p>錄音存在這支手機的瀏覽器裡，不會上傳。刪除 Safari 網站資料會一併清除錄音，重要的錄音請用右上角分享鍵另存。${esc(used)}</p>`,btns:[['完成','ok']]});
  // 讀取選單需在關閉前，所以用事件
};
document.addEventListener('change',e=>{if(e.target.id==='mSel'){S.model=e.target.value;saveS();toast('已切換模型')}});
new MutationObserver(()=>{const s=$('#mSel');if(s&&!s.dataset.set){s.value=S.model;s.dataset.set=1}}).observe($('#sheet'),{childList:true});

/* ---------- 啟動 ---------- */
(async()=>{
  try{db=await openDB();recs=await allRecs();navigator.storage?.persist?.()}catch(e){toast('無法使用儲存空間，錄音不會被保存')}
  renderList();
})();
}
</script>
